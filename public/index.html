<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Beastbound: Wild Realm 3D</title><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{border:1px solid #496482;background:#122238;color:#fff;border-radius:12px;padding:10px;font-weight:700;touch-action:manipulation}button:active{transform:scale(.96);background:#29486d}button:disabled{opacity:.45}#game{position:fixed;inset:0}#world{position:absolute;inset:0}canvas{display:block}.hud{position:fixed;top:8px;left:8px;right:8px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.stat{background:#07101de8;border:1px solid #405775;border-radius:10px;padding:7px 9px;font-size:12px}.overlay{position:fixed;inset:0;z-index:30;background:#03060cea;display:flex;align-items:center;justify-content:center;padding:14px}.panel{width:min(94%,700px);max-height:92vh;overflow:auto;background:#0b1422;border:1px solid #48617e;border-radius:20px;padding:18px;box-shadow:0 20px 70px #000}h1{color:#64b5ff;margin:0 0 6px}h2{margin:8px 0}p{color:#b8c5d7;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#101e31;border:1px solid #3e5673;border-radius:12px;padding:11px;text-align:left}.small{font-size:11px;color:#9eacc0}.icon{font-size:34px}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}input{background:#07101b;color:#fff;border:1px solid #30445d;border-radius:10px;padding:11px;width:100%;touch-action:manipulation}.close{width:100%;margin-top:10px}.hidden{display:none!important}#controls{position:fixed;left:15px;bottom:15px;z-index:20;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:5px}#controls button{padding:0;font-size:21px;background:#0b1829dd}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#menuBtn{position:fixed;right:15px;bottom:18px;z-index:20;width:58px;height:58px;font-size:22px}#actions{position:fixed;right:15px;bottom:88px;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:190px}#actions button{padding:9px;background:#101e31e8}#message{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);z-index:25;background:#07101df5;border:1px solid #55708f;border-radius:13px;padding:10px 14px;width:min(88%,430px);text-align:center;display:none}.battle{position:fixed;inset:0;z-index:40;background:#03060cf2;display:none;align-items:center;justify-content:center;padding:14px}.battle .panel{max-width:650px}.battleGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hp{height:10px;background:#303844;border-radius:20px;overflow:hidden;margin:5px 0}.hp i{display:block;height:100%;background:#35d47b}.battleActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.log{height:100px;overflow:auto;background:#050a11;border-radius:10px;padding:8px;font-size:12px;line-height:1.45;margin-top:9px}.chat{height:170px;overflow:auto;background:#050a11;border-radius:10px;padding:8px;font-size:12px}.msg{margin:5px 0}.menuList{max-height:310px;overflow:auto}@media(max-width:500px){.grid,.battleGrid{grid-template-columns:1fr}.panel{padding:14px}#actions{width:175px}}
</style></head><body><div id="game"><div id="world"></div><div id="hud" class="hud"></div><div id="controls"><button class="up" data-move="0,-1">▲</button><button class="left" data-move="-1,0">◀</button><button class="down" data-move="0,1">▼</button><button class="right" data-move="1,0">▶</button></div><div id="actions"><button data-action="attack">⚔️ Attack</button><button data-action="shadow">🌑 Shadow Necromancy</button><button data-action="bone">🦴 Bone Warrior</button><button data-action="find">🐾 Find Beast</button></div><button id="menuBtn">☰</button><div id="message"></div>
<div id="start" class="overlay"><div class="panel"><h1>🐾 Beastbound: Wild Realm 3D</h1><p>Beastbound's multiplayer world, chat and creatures, rebuilt inside the Beast Tamer 3D RPG.</p><h2>Enter the realm</h2><input id="name" maxlength="18" placeholder="Trainer name"><h2>Choose your class</h2><div class="grid" id="classes"></div><p id="engineStatus" class="small">3D engine loading...</p></div></div>
<div id="menu" class="overlay hidden"><div class="panel"><h1>📜 Hunter Menu</h1><div id="menuContent"></div><button class="close" data-action="closeMenu">Close</button></div></div>
<div id="battle" class="battle"><div class="panel"><h1>⚔️ Wild Encounter</h1><div class="battleGrid"><div class="card"><span class="icon" id="enemyIcon">🐾</span><b id="enemyName">Wild Beast</b><div id="enemyInfo" class="small"></div><div class="hp"><i id="enemyHp"></i></div></div><div class="card"><span class="icon">🧑</span><b id="playerName">Hunter</b><div id="teamInfo" class="small"></div></div></div><div class="battleActions"><button data-battle="attack">⚔️ Team Attack</button><button data-battle="tame">🔮 Tame</button><button data-battle="shadow">🌑 Shadow Necromancy</button><button data-battle="run">🏃 Run</button></div><div id="battleLog" class="log"></div></div></div>
</div><script>
const socket=io();
let state={name:'Trainer',level:1,xp:0,gold:100,rank:'E',cls:'Warrior',team:[],shadowArmy:[],x:0,z:0};let players=new Map();let enemy=null,boneUntil=0,keys={};let scene,camera,renderer,playerGroup,clock;let creatures=[];let worldBuilt=false;const rankList=['E','D','C','B','A','S','SS'];
const classes={Warrior:{skill:'Power Strike'},Mage:{skill:'Arc Burst'},Ranger:{skill:'Beast Shot'},Guardian:{skill:'Iron Guard'},Necromancer:{skill:'Shadow Necromancy'}};
const species=[
{name:'Emberfox',icon:'🦊',affinity:'Fire',color:0xff7138,hp:70,atk:15,def:8},{name:'Mossling',icon:'🌿',affinity:'Nature',color:0x65c466,hp:82,atk:12,def:11},{name:'Aquaphin',icon:'🐬',affinity:'Water',color:0x58a9e8,hp:86,atk:13,def:12},{name:'Stormcub',icon:'🐯',affinity:'Lightning',color:0x8b82ff,hp:68,atk:18,def:7},{name:'Rockhorn',icon:'🦏',affinity:'Earth',color:0xa78663,hp:105,atk:11,def:19},{name:'Moonowl',icon:'🦉',affinity:'Mystic',color:0xb77cff,hp:72,atk:17,def:9},{name:'Flame Hound',icon:'🐕',affinity:'Fire',color:0xff5a24,hp:115,atk:24,def:14},{name:'Frost Drake',icon:'🐉',affinity:'Ice',color:0x9ee8ff,hp:160,atk:31,def:20},{name:'Void Stalker',icon:'👁️',affinity:'Void',color:0x4b1c70,hp:190,atk:38,def:24}];
function cloneBeast(s,l=1,shadow=false){return {name:s.name,icon:s.icon,affinity:s.affinity,color:s.color,maxHp:s.hp+l*8,hp:s.hp+l*8,atk:s.atk+l*2,def:s.def+l,level:l,shadow};}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function setupClasses(){document.getElementById('classes').innerHTML=Object.keys(classes).map(c=>`<button class="card" data-class="${c}"><b>${c==='Necromancer'?'💀':'⚔️'} ${c}</b><div class="small">Class skill: ${classes[c].skill}</div><p>${c==='Necromancer'?'Unlocks unlimited Shadow Necromancy and Bone Warrior.':'Fight beside your beast team and unlock class skills.'}</p></button>`).join('');document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>startGame(b.dataset.class));}
function startGame(cls){if(typeof THREE==='undefined'){document.getElementById('engineStatus').textContent='❌ 3D engine failed to load. Check internet connection.';return}state.cls=cls;const s=species[0];state.team=[cloneBeast(s)];localStorage.setItem('bbtSave',JSON.stringify(state));socket.emit('join',document.getElementById('name').value.trim()||'Trainer');document.getElementById('start').classList.add('hidden');init3D();ui();say(`Welcome, ${cls}. Explore the Wild Realm.`);}
function init3D(){if(worldBuilt)return;worldBuilt=true;scene=new THREE.Scene();scene.background=new THREE.Color(0x75a8cf);scene.fog=new THREE.Fog(0x75a8cf,30,100);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('world').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcecff,0x31502e,1.6));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(25,45,15);sun.castShadow=true;scene.add(sun);makeWorld();makePlayer();clock=new THREE.Clock();animate();}
function mat(c){return new THREE.MeshStandardMaterial({color:c});}
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function makeWorld(){const g=box(0,-.3,0,100,.5,100,0x4f9a58);const path=mat(0xc7a56d);const p1=new THREE.Mesh(new THREE.BoxGeometry(100,.08,7),path);p1.position.y=.02;scene.add(p1);const p2=new THREE.Mesh(new THREE.BoxGeometry(7,.09,100),path);p2.position.y=.03;scene.add(p2);for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,r=24+Math.random()*22;makeTree(Math.cos(a)*r,Math.sin(a)*r)}makeBuilding(-18,0,'BEAST CENTER',0x9a663f);makeBuilding(18,0,'SHOP',0x5b6ca8);makeBuilding(0,-19,'TOWN',0x6c9c55);}
function makeTree(x,z){const t=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),mat(0x704a2d));trunk.position.y=1;t.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,10,8),mat(0x2f8548));crown.position.y=2.3;t.add(crown);t.position.set(x,0,z);scene.add(t);}
function makeBuilding(x,z,label,c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(8,4.5,6),mat(c));body.position.y=2.25;g.add(body);const roof=new THREE.Mesh(new THREE.ConeGeometry(5.6,2.3,4),mat(0x503329));roof.rotation.y=Math.PI/4;roof.position.y=5.5;g.add(roof);g.position.set(x,0,z);scene.add(g);}
function makePlayer(){playerGroup=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.8,.7),mat(0xe34f50));body.position.y=1.3;playerGroup.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.55,12,10),mat(0xffd3a0));head.position.y=2.6;playerGroup.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.58,12,8,0,Math.PI*2,0,Math.PI*.45),mat(0x382820));hair.position.y=2.85;playerGroup.add(hair);const leg=mat(0x202a3b);for(const x of [-.25,.25]){const l=new THREE.Mesh(new THREE.BoxGeometry(.22,1,.25),leg);l.position.set(x,.35,0);playerGroup.add(l)}playerGroup.position.set(state.x,0,state.z);scene.add(playerGroup);}
function makeCreature(b,pos){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(.75,12,10),mat(b.color||0x777777));body.scale.set(1.2,.9,1.3);body.position.y=.9;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,10),mat(b.color||0x777777));head.position.set(0,1.65,.15);g.add(head);const eye=mat(0x101010);for(const sx of [-.18,.18]){const e=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),eye);e.position.set(sx,1.76,.55);g.add(e)}g.position.copy(pos);scene.add(g);creatures.push(g);return g;}
function spawnVisibleTeam(){if(!scene)return;creatures.forEach(g=>scene.remove(g));creatures=[];state.team.slice(0,4).forEach((b,i)=>makeCreature(b,new THREE.Vector3(-2+i*1.35,.0,2+Math.abs(i-1)*.8)));if(state.shadowArmy.length)state.shadowArmy.slice(-4).forEach((b,i)=>makeCreature({...b,color:0x24133f},new THREE.Vector3(2+i*1.2,0,-2)));if(boneUntil>Date.now())makeCreature({color:0xd9d9d9},new THREE.Vector3(0,0,-3));}
function move(dx,dz){state.x=Math.max(-45,Math.min(45,state.x+dx));state.z=Math.max(-45,Math.min(45,state.z+dz));if(playerGroup){playerGroup.position.x=state.x;playerGroup.position.z=state.z;playerGroup.rotation.y=Math.atan2(dx,dz)}socket.emit('move',{x:state.x,z:state.z});}
function animate(){requestAnimationFrame(animate);if(playerGroup){const target=new THREE.Vector3(state.x+8,8,state.z+10);camera.position.lerp(target,.08);camera.lookAt(state.x,0,state.z);creatures.forEach((g,i)=>g.position.y=.08+Math.sin(performance.now()*.003+i)*.05)}renderer.render(scene,camera);}
function ui(){document.getElementById('hud').innerHTML=`<div class="stat">🧑 <b>${esc(state.name)}</b> Lv.${state.level}</div><div class="stat">🏆 Rank ${state.rank}</div><div class="stat">🧙 ${state.cls}</div><div class="stat">💰 ${state.gold}</div><div class="stat">🐾 Team ${state.team.length}</div><div class="stat">🌑 Shadows ${state.shadowArmy.length}</div>`;spawnVisibleTeam();}
function say(t){const e=document.getElementById('message');e.textContent=t;e.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>e.style.display='none',2200);}
function gainXp(n){state.xp+=n;while(state.xp>=state.level*50){state.xp-=state.level*50;state.level++;const idx=Math.min(rankList.length-1,Math.floor((state.level-1)/3));state.rank=rankList[idx];say(`⭐ Level ${state.level}! Rank ${state.rank}.`)}save();}
function save(){localStorage.setItem('bbtSave',JSON.stringify(state));socket.emit('saveState',state);}
function findBeast(){const s=species[Math.floor(Math.random()*species.length)];enemy=cloneBeast(s,Math.max(1,state.level+Math.floor(Math.random()*3)-1));renderBattle();}
function renderBattle(){if(!enemy)return;document.getElementById('battle').style.display='flex';document.getElementById('enemyIcon').textContent=enemy.icon;document.getElementById('enemyName').textContent=`${enemy.name} Lv.${enemy.level}`;document.getElementById('enemyInfo').textContent=`${enemy.affinity} • ATK ${enemy.atk} • DEF ${enemy.def}`;document.getElementById('enemyHp').style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%';document.getElementById('playerName').textContent=state.name;document.getElementById('teamInfo').textContent=`${state.team.map(b=>b.icon+' '+b.name).join(' • ')}${state.shadowArmy.length?' • 🌑 '+state.shadowArmy.length+' shadows':''}`;}
function log(t){const e=document.getElementById('battleLog');e.innerHTML+=`<div>${esc(t)}</div>`;e.scrollTop=e.scrollHeight;}
function battleAttack(){if(!enemy)return;let dmg=8+state.level*2+(state.cls==='Warrior'?7:state.cls==='Mage'?5:0);state.team.filter(b=>b.hp>0).forEach(b=>{dmg+=Math.max(2,b.atk-Math.floor(enemy.def/3));});if(state.shadowArmy.length)dmg+=Math.min(100,state.shadowArmy.length*3);enemy.hp=Math.max(0,enemy.hp-dmg);renderBattle();log(`⚔️ Your team dealt ${dmg} damage.`);if(enemy.hp<=0){victory();return}setTimeout(enemyHit,350);}
function enemyHit(){if(!enemy)return;const dmg=Math.max(1,enemy.atk-Math.floor((state.team[0]?.def||5)/3));state.team.forEach(b=>b.hp=Math.max(0,b.hp-dmg));log(`💥 ${enemy.name} attacked the team.`);if(state.team.every(b=>b.hp<=0)){state.team.forEach(b=>b.hp=b.maxHp);say('Your team recovered after the defeat.');closeBattle();}else renderBattle();}
function victory(){state.gold+=10+enemy.level*5;gainXp(15+enemy.level*5);log(`🏆 ${enemy.name} defeated!`);say(`Victory! +${10+enemy.level*5} gold`);enemy=null;setTimeout(closeBattle,500);save();}
function tame(){if(!enemy)return;const chance=.15+(1-enemy.hp/enemy.maxHp)*.75;if(Math.random()<chance){const copy={...enemy,hp:enemy.maxHp,shadow:false};if(state.team.length<6){state.team.push(copy);say(`🔮 ${copy.name} joined your team!`)}else{state.gold+=15;say('Your team is full. You received 15 gold.')}save();closeBattle();}else{log('❌ The beast broke free!');enemyHit();}}
function shadowNecromancy(){if(state.cls!=='Necromancer'){say('🔒 Shadow Necromancy belongs to the Necromancer class.');return}if(!enemy){say('Find a beast first.');return}if(enemy.hp>enemy.maxHp*.35){say('🌑 Weaken the enemy below 35% HP first.');return}state.shadowArmy.push({...enemy,shadow:true,hp:enemy.maxHp});say(`🌑 ${enemy.name} joined your unlimited Shadow Army!`);save();closeBattle();}
function bone(){if(state.cls!=='Necromancer'){say('🔒 Only the Necromancer can summon Bone Warrior.');return}boneUntil=Date.now()+60000;spawnVisibleTeam();say('🦴 Bone Warrior summoned for 60 seconds.');}
function closeBattle(){enemy=null;document.getElementById('battle').style.display='none';spawnVisibleTeam();}
function openMenu(){document.getElementById('menuContent').innerHTML=`<p>🏆 Rank <b>${state.rank}</b> · ⭐ Level <b>${state.level}</b> · XP <b>${state.xp}</b></p><p>💰 Gold <b>${state.gold}</b> · 🧙 <b>${state.cls}</b></p><h3>🐾 Beast Team</h3><div class="menuList">${state.team.map((b,i)=>`<div class="card"><b>${i===0?'⭐ ':''}${b.icon} ${esc(b.name)}</b><div class="small">${b.affinity} · Lv.${b.level} · HP ${b.hp}/${b.maxHp} · ATK ${b.atk}</div></div>`).join('')}</div><h3>🌑 Shadow Army: ${state.shadowArmy.length}</h3><div class="small">${state.shadowArmy.length?state.shadowArmy.map(b=>b.icon+' '+esc(b.name)).join(', '):'None yet'}</div><h3>💬 Greenleaf Chat</h3><div id="chat" class="chat"></div><input id="chatInput" placeholder="Message..."><button id="chatSend" style="width:100%;margin-top:5px">Send</button>`;document.getElementById('menu').classList.remove('hidden');document.getElementById('chatSend').onclick=sendChat;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')sendChat()};chatHistory.forEach(m=>appendChat(m));}
function closeMenu(){document.getElementById('menu').classList.add('hidden')}
let chatHistory=[];function appendChat(m){const e=document.getElementById('chat');if(!e)return;e.innerHTML+=`<div class="msg"><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`;e.scrollTop=e.scrollHeight}
function sendChat(){const i=document.getElementById('chatInput');if(i&&i.value.trim()){socket.emit('chat',i.value.trim());i.value=''}}
function handleMoveButtons(){document.querySelectorAll('[data-move]').forEach(b=>{const [dx,dz]=b.dataset.move.split(',').map(Number);b.onpointerdown=e=>{e.preventDefault();move(dx,dz)}})}
setupClasses();handleMoveButtons();document.getElementById('menuBtn').onclick=openMenu;document.querySelector('[data-action="closeMenu"]').onclick=closeMenu;document.querySelector('[data-action="attack"]').onclick=()=>enemy?battleAttack():say('Find a wild beast first.');document.querySelector('[data-action="shadow"]').onclick=()=>enemy?shadowNecromancy():say('Find a beast first.');document.querySelector('[data-action="bone"]').onclick=bone;document.querySelector('[data-action="find"]').onclick=findBeast;document.querySelector('[data-battle="attack"]').onclick=battleAttack;document.querySelector('[data-battle="tame"]').onclick=tame;document.querySelector('[data-battle="shadow"]').onclick=shadowNecromancy;document.querySelector('[data-battle="run"]').onclick=closeBattle;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});let lastMove=0;function keyLoop(t){if(worldBuilt&&t-lastMove>120){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dz){move(dx*.7,dz*.7);lastMove=t}}requestAnimationFrame(keyLoop)}requestAnimationFrame(keyLoop);
socket.on('state',p=>{state=Object.assign(state,p);if(!worldBuilt&&!document.getElementById('start').classList.contains('hidden'))return;ui();save()});socket.on('players',a=>players=new Map(a.map(p=>[p.id,p])));socket.on('move',p=>{const q=players.get(p.id);if(q){q.x=p.x;q.z=p.z}});socket.on('chat',m=>{chatHistory.push(m);if(chatHistory.length>50)chatHistory.shift();appendChat(m)});socket.on('connect',()=>document.getElementById('engineStatus').textContent='🟢 Multiplayer server connected');socket.on('disconnect',()=>document.getElementById('engineStatus').textContent='🟡 Server disconnected');
const old=localStorage.getItem('bbtSave');if(old){try{const s=JSON.parse(old);if(s&&s.team?.length){state=s;document.getElementById('name').value=s.name||'';}}catch(e){}}
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
</script></body></html>
